name: Build jood

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Test
        working-directory: source/jood
        run: go test ./...

      - name: Build Android ARM64
        working-directory: source/jood
        env:
          CGO_ENABLED: '0'
          GOOS: android
          GOARCH: arm64
        run: go build -trimpath -ldflags='-s -w' -o ../../bin/jood .

      - name: Upload jood artifact
        uses: actions/upload-artifact@v4
        with:
          name: jood-android-arm64
          path: bin/jood
